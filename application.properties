spring.application.name=FNAFHS-Academy
server.port=${PORT:8080}

# Base de datos Aiven (PostgreSQL) - 24/7, no depende de tu PC
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/fnafhs_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 solo si NO defines DB_URL (fallback local de emergencia)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Cloudinary (imágenes, videos, comics)
cloudinary.cloud-name=${CLOUDINARY_NAME:}
cloudinary.api-key=${CLOUDINARY_KEY:}
cloudinary.api-secret=${CLOUDINARY_SECRET:}

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

spring.thymeleaf.cache=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USER:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.base-url=${APP_BASE_URL:http://localhost:8080}

spring.web.cors.allowed-origins=${CORS_ORIGINS:http://localhost:8080}
spring.web.cors.allowed-methods=*
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true