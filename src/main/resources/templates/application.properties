spring.application.name=FNAFHS-Academy
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/fnafhs_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

cloudinary.cloud-name=${CLOUDINARY_NAME:}
cloudinary.api-key=${CLOUDINARY_KEY:}
cloudinary.api-secret=${CLOUDINARY_SECRET:}

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

spring.thymeleaf.cache=false

brevo.api-key=${BREVO_API_KEY:}
email.from=${EMAIL_FROM:dianix970@gmail.com}
email.from-name=${EMAIL_FROM_NAME:FNAFHS Academy}

app.base-url=${APP_BASE_URL:http://localhost:8080}

spring.web.cors.allowed-origins=${CORS_ORIGINS:http://localhost:8080}
spring.web.cors.allowed-methods=*
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

logging.level.com.example.semana07=INFO
logging.level.org.springframework.security=WARN